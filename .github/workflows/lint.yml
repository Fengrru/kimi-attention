name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy

      - name: Run black (format check)
        run: black --check --diff kimi_attention/ tests/ scripts/ examples/

      - name: Run isort (import check)
        run: isort --check-only --diff kimi_attention/ tests/ scripts/ examples/

      - name: Run flake8
        run: flake8 kimi_attention/ tests/ scripts/ examples/ --max-line-length=100 --count --show-source --statistics

      - name: Run mypy
        run: mypy kimi_attention/ --ignore-missing-imports
